<style>

    --viz-series-2: #8b5cf6;
    --viz-series-3: #00a6a6;
    --viz-series-4: #e85d75;
    --viz-series-5: #d98d20;
    --viz-series-6: #5c7c3b;

    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color-scheme: light dark;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% 5%, rgba(51, 102, 255, 0.12), transparent 34rem),
      var(--background);
    color: var(--foreground);

  h2 { margin: 0; font-size: clamp(1.45rem, 4vw, 2.15rem); }
  p { line-height: 1.45; }

  #mind-sigil-3d {
    width: min(100%, 1180px);
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) max(0.85rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(0.85rem, env(safe-area-inset-left));
  }

  .viz-controls, .viz-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.45rem;

  .viz-row { justify-content: space-between; }

  .viz-badge {
    display: inline-flex;
    align-items: center;
    min-height: 1.75rem;
    padding: 0.28rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted-foreground);
    font-size: 0.78rem;
    line-height: 1.1;

  .form-select {
    min-height: 2.5rem;

    background: var(--card);
    color: var(--foreground);
    padding: 0.55rem 0.78rem;

    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    color: var(--muted-foreground);
    font-size: 0.88rem;
  }


  .card {
    border: 1px solid var(--border);
    border-radius: 1rem;
    background: var(--card);
    padding: 0.85rem;
    backdrop-filter: blur(18px);
  }

  .text-small { font-size: 0.78rem; }

  #mind-sigil-3d .ms3-scene {
    border: 1px solid var(--border);
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background: #090d16;
      --foreground: #edf2ff;
      --card: rgba(18, 25, 40, 0.82);
      --muted-foreground: #9aa8c0;
      --border: rgba(237, 242, 255, 0.16);
      --yellow: #ffd166;
      --viz-series-1: #6d8cff;
      --viz-series-2: #ad84ff;
      --viz-series-3: #42d4cf;
      --viz-series-4: #ff8296;
      --viz-series-5: #f6b957;
      --viz-series-6: #9bc66f;
    }

    body {
      background:
        radial-gradient(circle at 50% 5%, rgba(109, 140, 255, 0.14), transparent 34rem),
        var(--background);
    }

    #mind-sigil-3d .ms3-scene { background: rgba(255, 255, 255, 0.025); }
  }

  @media (max-width: 520px) {
    .form-label { width: 100%; justify-content: space-between; }
    .form-select { flex: 1; min-width: 0; }
  }

<body>

<section id="mind-sigil-3d" aria-labelledby="ms3-title">
  <header class="ms3-header">
    <h2 id="ms3-title">Philosophical taxonomies as recursive sigils</h2>
    <p>Opaque children float inside the current sigil; neighboring scopes open as portals in its wall.</p>
  </header>

  <label class="form-label ms3-map-control" for="ms3-map">Taxonomy
    <select id="ms3-map" class="form-select">
      <option value="subjectWorld" selected>Subject–world articulation</option>
      <option value="mind">Mind: non-synonymous capacities</option>
    </select>
  </label>

  <div id="ms3-scene" class="ms3-scene">
    <canvas id="ms3-canvas" aria-label="Interactive three-dimensional recursive sigil structure"></canvas>
    <div id="ms3-labels" class="ms3-label-layer"></div>
  </div>

  <div id="ms3-detail" class="card ms3-detail" aria-live="polite"></div>
</section>

<script type="module">
const rootElement = document.getElementById("mind-sigil-3d");
const sceneElement = document.getElementById("ms3-scene");
const canvas = document.getElementById("ms3-canvas");
const labelLayer = document.getElementById("ms3-labels");
const detailElement = document.getElementById("ms3-detail");
const mapSelect = document.getElementById("ms3-map");

const shortLabels = {
  "subject-world": "Subject–world",
  "structural-vocabulary": "Structure",
  "levels": "Description levels",
  "experience-domain": "Experience",
  "selection-domain": "Attention",
  "content-domain": "Mental content",
  "cognition-domain": "Cognition",
  "memory-domain": "Memory",
  "affect-domain": "Affect",
  "agency-domain": "Agency",
  "self-domain": "Self",
  "social-domain": "Social mind"
};

const FISHBOWL_CUT_ANGLE = Math.PI * 0.2;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

let THREE;
let renderer;
let scene;
let camera;
let taxonomies;
let semanticLayouts;
let taxonomy;
let currentNode;
let currentTaxonomyKey = "subjectWorld";
let worldStack = [];
let nodeIndex = new Map();
let parentIndex = new Map();
let pathIndex = new Map();

let worldGroup;
let positions = new Map();
let fishbowls = new Map();
let labelEntries = [];
let attentionMesh;
let attentionTarget;
let upSigilEntry;
let upSigilPosition;
let palette = [];
let neutralColor;
let wallColor;
let attentionColor;

let currentWorldRadius = 5.8;
let parentWorldRadius = 0;
let yaw = 0.62;
let pitch = 0.46;
let distance = 4.7;
let targetY = -1.15;
let dragging = false;
let moved = false;
let pointerStart = { x: 0, y: 0 };
let lastPointer = { x: 0, y: 0 };
let interactionLocked = false;
let cameraTransition = null;
let transitionCompletion = null;

function resolveColor(variableName) {
  const probe = document.createElement("span");
  probe.style.color = "var(" + variableName + ")";
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  rootElement.append(probe);
  const value = getComputedStyle(probe).color;
  probe.remove();
  return value;
}

function updatePalette() {
  palette = [1, 2, 3, 4, 5, 6].map((index) =>
    new THREE.Color(resolveColor("--viz-series-" + index))
  );
  neutralColor = new THREE.Color(resolveColor("--muted-foreground"));
  wallColor = new THREE.Color(resolveColor("--background")).lerp(neutralColor, 0.05);
  attentionColor = new THREE.Color(resolveColor("--yellow"));
}

function indexTree(node, parent = null, path = []) {
  node.children = node.children || [];
  nodeIndex.set(node.id, node);
  parentIndex.set(node.id, parent);
  pathIndex.set(node.id, path.concat(node.label));
  node.children.forEach((child) => indexTree(child, node, path.concat(node.label)));
}

function activateTaxonomy(key) {
  currentTaxonomyKey = key;
  taxonomy = taxonomies[key];
  nodeIndex = new Map();
  parentIndex = new Map();
  pathIndex = new Map();
  indexTree(taxonomy);
  worldStack = [];
  currentNode = taxonomy;
  cameraTransition = null;
  transitionCompletion = null;
  interactionLocked = false;
  renderCurrent();
  document.title = taxonomy.label + " — recursive sigils";
}

function disposeObject(object) {
  object.traverse((child) => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      const materials = Array.isArray(child.material) ? child.material : [child.material];
      materials.forEach((material) => material.dispose());
    }
  });
}

function clearWorld() {
  if (worldGroup) {
    scene.remove(worldGroup);
    disposeObject(worldGroup);
  }
  worldGroup = new THREE.Group();
  scene.add(worldGroup);
  positions = new Map();
  fishbowls = new Map();
  labelEntries = [];
  upSigilEntry = null;
  upSigilPosition = null;
  labelLayer.replaceChildren();
}

function fishbowlGeometry(radius, segments = 30) {
  return new THREE.SphereGeometry(
    radius,
    segments,
    Math.max(14, segments),
    0,
    Math.PI * 2,
    FISHBOWL_CUT_ANGLE,
    Math.PI - FISHBOWL_CUT_ANGLE
  );
}

function fishbowlLattice(radius, color, opacity) {
  const positions = [];
  const start = FISHBOWL_CUT_ANGLE;
  const end = Math.PI * 0.985;
  const meridians = 10;
  const meridianSteps = 26;
  const latitudeFractions = [0.2, 0.4, 0.6, 0.79, 0.93];

  for (let longitudeIndex = 0; longitudeIndex < meridians; longitudeIndex += 1) {
    const longitude = longitudeIndex * Math.PI * 2 / meridians;
    for (let step = 0; step < meridianSteps; step += 1) {
      const firstPhi = start + (end - start) * step / meridianSteps;
      const secondPhi = start + (end - start) * (step + 1) / meridianSteps;
      [firstPhi, secondPhi].forEach((phi) => {
        const ringRadius = radius * Math.sin(phi);
        positions.push(
          ringRadius * Math.cos(longitude),
          radius * Math.cos(phi),
          ringRadius * Math.sin(longitude)
        );
      });
    }
  }

  latitudeFractions.forEach((fraction) => {
    const phi = start + (end - start) * fraction;
    const ringRadius = radius * Math.sin(phi);
    const y = radius * Math.cos(phi);
    const steps = 56;
    for (let step = 0; step < steps; step += 1) {
      const firstLongitude = step * Math.PI * 2 / steps;
      const secondLongitude = (step + 1) * Math.PI * 2 / steps;
      positions.push(
        ringRadius * Math.cos(firstLongitude), y, ringRadius * Math.sin(firstLongitude),
        ringRadius * Math.cos(secondLongitude), y, ringRadius * Math.sin(secondLongitude)
      );
    }
  });

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  return new THREE.LineSegments(
    geometry,
    new THREE.LineBasicMaterial({
      color,
      transparent: true,
      opacity,
      depthWrite: false
    })
  );
}

function makeFishbowl(node, radius, color, options = {}) {
  const group = new THREE.Group();
  const opacity = options.opacity === undefined ? 0.18 : options.opacity;
  const opaque = Boolean(options.opaque);
  const shell = new THREE.Mesh(
    fishbowlGeometry(radius),
    new THREE.MeshBasicMaterial({
      color,
      transparent: !opaque,
      opacity: opaque ? 1 : opacity,
      depthWrite: opaque,
      side: THREE.DoubleSide
    })
  );
  const openingRadius = radius * Math.sin(FISHBOWL_CUT_ANGLE);
  const openingHeight = radius * Math.cos(FISHBOWL_CUT_ANGLE);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(openingRadius, Math.max(0.018, radius * 0.025), 8, 72),
    new THREE.MeshBasicMaterial({
      color,
      transparent: !opaque,
      opacity: opaque ? 1 : (options.exit ? 0.72 : Math.min(0.9, opacity * 3.8)),
      depthWrite: opaque
    })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = openingHeight;

  if (options.child) {
    shell.userData.nodeId = node.id;
    rim.userData.nodeId = node.id;
  }
  if (options.exit) {
    rim.userData.exitCurrent = true;
    const portal = new THREE.Mesh(
      new THREE.CircleGeometry(openingRadius * 0.94, 72),
      new THREE.MeshBasicMaterial({
        color: attentionColor,
        transparent: true,
        opacity: 0.035,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    portal.rotation.x = -Math.PI / 2;
    portal.position.y = openingHeight + 0.012;
    portal.userData.exitCurrent = true;
    group.add(portal);
  }

  group.add(shell, rim);
  if (options.latticeOpacity) {
    const lattice = fishbowlLattice(
      radius * (opaque ? 0.994 : 1.002),
      neutralColor,
      options.latticeOpacity
    );
    group.add(lattice);
  }
  if (options.renderOrder !== undefined) {
    group.traverse((object) => { object.renderOrder = options.renderOrder; });
  }
  return { group, shell, rim, radius, openingHeight, openingRadius };
}

function makeExteriorSigil(node, radius, color, options = {}) {
  const group = new THREE.Group();
  const sphere = new THREE.Mesh(
    new THREE.SphereGeometry(radius, 32, 24),
    new THREE.MeshStandardMaterial({
      color,
      emissive: color.clone().multiplyScalar(options.exit ? 0.16 : 0.06),
      emissiveIntensity: 0.45,
      roughness: 0.72,
      metalness: 0,
      transparent: false,
      depthWrite: true
    })
  );
  if (options.exit) sphere.userData.exitCurrent = true;
  else sphere.userData.nodeId = node.id;
  sphere.userData.labelKey = options.exit ? "__up__" : node.id;
  if (options.renderOrder !== undefined) sphere.renderOrder = options.renderOrder;
  group.add(sphere);
  return { group, shell: sphere, radius };
}

function makeNeighborPortal(node, direction, color, options = {}) {
  const group = new THREE.Group();
  const radius = options.radius || 0.38;
  const length = options.length || 0.62;
  const mouth = direction.clone().multiplyScalar(currentWorldRadius - 0.08);
  group.position.copy(mouth);

  const ringGeometry = new THREE.TorusGeometry(radius, 0.045, 10, 48);
  const ringMaterial = new THREE.MeshStandardMaterial({
    color,
    emissive: color.clone().multiplyScalar(0.12),
    emissiveIntensity: 0.55,
    roughness: 0.58,
    metalness: 0
  });
  const orientRing = new THREE.Quaternion().setFromUnitVectors(
    new THREE.Vector3(0, 0, 1),
    direction
  );
  const innerRing = new THREE.Mesh(ringGeometry, ringMaterial);
  innerRing.quaternion.copy(orientRing);
  innerRing.userData.nodeId = node.id;

  const tunnel = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.9, radius, length, 32, 1, true),
    new THREE.MeshStandardMaterial({
      color,
      transparent: true,
      opacity: 0.46,
      depthWrite: false,
      side: THREE.DoubleSide,
      roughness: 0.7,
      metalness: 0
    })
  );
  tunnel.position.copy(direction.clone().multiplyScalar(length * 0.5));
  tunnel.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
  tunnel.userData.nodeId = node.id;

  const opening = new THREE.Mesh(
    new THREE.CircleGeometry(radius * 0.88, 40),
    new THREE.MeshBasicMaterial({
      color: color.clone().multiplyScalar(0.26),
      transparent: true,
      opacity: 0.76,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  opening.position.copy(direction.clone().multiplyScalar(-0.012));
  opening.quaternion.copy(orientRing);
  opening.userData.nodeId = node.id;

  group.add(tunnel, opening, innerRing);
  group.traverse((object) => {
    if (object.isMesh) object.userData.labelKey = node.id;
  });
  return { group, radius, length, direction: direction.clone(), mouth };
}

function portalDirection(position) {
  const direction = position.clone().normalize();
  const constrainedY = Math.max(-0.68, Math.min(0.68, direction.y));
  if (Math.abs(direction.y - constrainedY) < 1e-6) return direction;
  const angle = Math.atan2(direction.z, direction.x);
  const horizontal = Math.sqrt(1 - constrainedY * constrainedY);
  return new THREE.Vector3(
    Math.cos(angle) * horizontal,
    constrainedY,
    Math.sin(angle) * horizontal
  );
}

function constrainPortalDirection(direction, viewDirection) {
  let constrained = direction.clone().normalize();
  const maximumViewDot = -0.04;
  for (let pass = 0; pass < 2; pass += 1) {
    constrained = portalDirection(constrained);
    const viewDot = constrained.dot(viewDirection);
    if (viewDot <= maximumViewDot) continue;
    let tangent = constrained.clone().addScaledVector(viewDirection, -viewDot);
    if (tangent.lengthSq() < 1e-6) {
      tangent = new THREE.Vector3(0, 1, 0).cross(viewDirection);
      if (tangent.lengthSq() < 1e-6) tangent.set(1, 0, 0);
    }
    tangent.normalize().multiplyScalar(Math.sqrt(1 - maximumViewDot * maximumViewDot));
    constrained = tangent.add(viewDirection.clone().multiplyScalar(maximumViewDot)).normalize();
  }
  return constrained;
}

function arrangedPortalDirections(layout) {
  if (!layout.length) return [];
  const viewDirection = desiredCameraPosition()
    .sub(new THREE.Vector3(0, targetY, 0))
    .normalize();
  const farWallDirection = viewDirection.clone().multiplyScalar(-1);
  const raw = layout.map((item) =>
    portalDirection(new THREE.Vector3(item.x, item.y, item.z))
  );
  const centroid = raw.reduce(
    (sum, direction) => sum.add(direction),
    new THREE.Vector3()
  );
  const rotation = new THREE.Quaternion();
  if (centroid.lengthSq() > 1e-6) {
    rotation.setFromUnitVectors(centroid.normalize(), farWallDirection);
  }
  const anchors = raw.map((direction) =>
    constrainPortalDirection(direction.clone().applyQuaternion(rotation), viewDirection)
  );
  const directions = anchors.map((direction) => direction.clone());
  const minimumAngle = layout.length > 10 ? 0.39 : 0.47;

  for (let iteration = 0; iteration < 110; iteration += 1) {
    const forces = directions.map((direction, index) => {
      const anchorTangent = anchors[index]
        .clone()
        .addScaledVector(direction, -anchors[index].dot(direction));
      return anchorTangent.multiplyScalar(0.022);
    });

    for (let first = 0; first < directions.length; first += 1) {
      for (let second = first + 1; second < directions.length; second += 1) {
        const dot = Math.max(-1, Math.min(1, directions[first].dot(directions[second])));
        const angle = Math.acos(dot);
        if (angle >= minimumAngle) continue;
        const pressure = (minimumAngle - angle) * 0.34;
        const towardSecond = directions[second]
          .clone()
          .addScaledVector(directions[first], -dot)
          .normalize();
        const towardFirst = directions[first]
          .clone()
          .addScaledVector(directions[second], -dot)
          .normalize();
        forces[first].addScaledVector(towardSecond, -pressure);
        forces[second].addScaledVector(towardFirst, -pressure);
      }
    }

    directions.forEach((direction, index) => {
      direction.add(forces[index]);
      directions[index] = constrainPortalDirection(direction, viewDirection);
    });
  }
  return directions;
}

function sphericalLayout(children, radius) {
  const count = children.length;
  if (!count) return [];
  if (count === 1) {
    return [{ child: children[0], x: 0, y: 0, z: -radius * 0.45 }];
  }
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));
  return children.map((child, index) => {
    const y = 1 - 2 * (index + 0.5) / count;
    const ring = Math.sqrt(Math.max(0, 1 - y * y));
    const angle = index * goldenAngle;
    return {
      child,
      x: Math.cos(angle) * ring * radius,
      y: y * radius,
      z: Math.sin(angle) * ring * radius
    };
  });
}

function semanticTaxonomyData() {
  return semanticLayouts && semanticLayouts.taxonomies
    ? semanticLayouts.taxonomies[currentTaxonomyKey]
    : null;
}

function semanticGroupData(parentNode) {
  if (!parentNode) return null;
  const taxonomyData = semanticTaxonomyData();
  return taxonomyData && taxonomyData.groups ? taxonomyData.groups[parentNode.id] : null;
}

function semanticColor(parentNode, node, fallbackIndex = 0) {
  const group = semanticGroupData(parentNode);
  const encoded = group && group.children ? group.children[node.id] : null;
  if (encoded && encoded.length > 3) {
    const orderedPalette = [5, 2, 0, 1, 3, 4];
    const position = Math.max(0, Math.min(1, (encoded[3] + 1) * 0.5))
      * (orderedPalette.length - 1);
    const lower = Math.floor(position);
    const upper = Math.min(orderedPalette.length - 1, lower + 1);
    return palette[orderedPalette[lower]].clone().lerp(
      palette[orderedPalette[upper]],
      position - lower
    );
  }

  const taxonomyData = semanticTaxonomyData();
  const nodeData = taxonomyData && taxonomyData.nodes ? taxonomyData.nodes[node.id] : null;
  const cluster = nodeData && Number.isInteger(nodeData.cluster)
    ? nodeData.cluster
    : fallbackIndex;
  return palette[cluster % palette.length].clone();
}

function scaledSemanticLayout(parentNode, children, extent) {
  const group = semanticGroupData(parentNode);
  if (!group || !group.children) return null;
  if (!children.every((child) => group.children[child.id])) return null;
  const points = children.map((child) => group.children[child.id].slice(0, 3));
  const centroid = points.reduce(
    (sum, point) => sum.map((value, axis) => value + point[axis]),
    [0, 0, 0]
  ).map((value) => value / Math.max(1, points.length));
  const centered = points.map((point) => point.map((value, axis) => value - centroid[axis]));
  const maximumRadius = Math.max(...centered.map((point) => Math.hypot(...point)));
  if (maximumRadius < 1e-6) return null;
  const semanticScale = extent / maximumRadius;
  return children.map((child, index) => {
    const encoded = centered[index];
    return {
      child,
      x: encoded[0] * semanticScale,
      y: encoded[1] * semanticScale,
      z: encoded[2] * semanticScale
    };
  });
}

function childLayout(children) {
  const extent = currentWorldRadius * (worldStack.length ? 0.76 : 0.72);
  const semantic = scaledSemanticLayout(
    currentNode,
    children,
    extent
  );
  if (semantic) return semantic;
  return sphericalLayout(children, extent);
}

function neighborLayout(parentNode, neighbors) {
  if (!parentNode || !neighbors.length) return [];
  const group = semanticGroupData(parentNode);
  const origin = group && group.children ? group.children[currentNode.id] : null;
  if (!origin || !neighbors.every((neighbor) => group.children[neighbor.id])) {
    return sphericalLayout(neighbors, currentWorldRadius + 1.8).map((item) => ({
      ...item,
      normalizedDistance: 0.5
    }));
  }

  const innerRadius = currentWorldRadius + 0.8;
  const outerRadius = parentWorldRadius - 0.75;
  const availableSpan = Math.max(0, outerRadius - innerRadius);
  const spread = group.spread || 1;
  return neighbors.map((neighbor, index) => {
    const encoded = group.children[neighbor.id];
    const delta = [
      encoded[0] - origin[0],
      encoded[1] - origin[1],
      encoded[2] - origin[2]
    ];
    let semanticDistance = Math.hypot(delta[0], delta[1], delta[2]);
    if (semanticDistance < 1e-6) {
      const angle = index * Math.PI * 2 / Math.max(1, neighbors.length);
      delta[0] = Math.cos(angle);
      delta[1] = 0;
      delta[2] = Math.sin(angle);
      semanticDistance = 1;
    }
    const direction = delta.map((value) => value / semanticDistance);
    const normalizedDistance = Math.min(1, semanticDistance * spread / 1.55);
    const radius = innerRadius + availableSpan * Math.pow(normalizedDistance, 0.85);
    return {
      child: neighbor,
      x: direction[0] * radius,
      y: direction[1] * radius,
      z: direction[2] * radius,
      normalizedDistance
    };
  });
}

function makeNodeLabel(node, position, relation) {
  const element = document.createElement("span");
  element.className = "ms3-label text-small";
  element.dataset.kind = "node";
  element.dataset.relation = relation;
  element.textContent = shortLabels[node.id] || node.label.replace(/^\d+\.\s*/, "");
  element.setAttribute("aria-hidden", "true");
  labelLayer.append(element);
  labelEntries.push({
    position,
    element,
    relation,
    labelKey: node.id,
    width: element.offsetWidth,
    height: element.offsetHeight
  });
}

function makeExitLabel(parentNode, position) {
  const element = document.createElement("span");
  element.className = "ms3-label text-small";
  element.dataset.kind = "exit";
  element.dataset.relation = "exit";
  element.textContent = "↑ " + (shortLabels[parentNode.id] || parentNode.label.replace(/^\d+\.\s*/, ""));
  element.setAttribute("aria-hidden", "true");
  labelLayer.append(element);
  labelEntries.push({
    position: position.clone(),
    element,
    relation: "exit",
    labelKey: "__up__",
    width: element.offsetWidth,
    height: element.offsetHeight
  });
}

function updateLabels() {
  const width = sceneElement.clientWidth;
  const height = sceneElement.clientHeight;
  const compact = width <= 520;
  const candidates = [];
  const labelRaycaster = new THREE.Raycaster();
  camera.updateMatrixWorld(true);

  const cameraRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
  const occludingSpheres = [];
  fishbowls.forEach((entry, labelKey) => {
    if (entry.relation !== "child") return;
    const center = entry.group.position.clone();
    const projectedCenter = center.clone().project(camera);
    if (projectedCenter.z <= -1 || projectedCenter.z >= 1) return;
    const projectedEdge = center
      .clone()
      .addScaledVector(cameraRight, entry.radius)
      .project(camera);
    occludingSpheres.push({
      labelKey,
      x: (projectedCenter.x * 0.5 + 0.5) * width,
      y: (-projectedCenter.y * 0.5 + 0.5) * height,
      radius: Math.abs(projectedEdge.x - projectedCenter.x) * width * 0.5,
      depth: camera.position.distanceTo(center) - entry.radius
    });
  });

  const occluded = (entry) => {
    const direction = entry.position.clone().sub(camera.position);
    const distanceToLabel = direction.length();
    if (distanceToLabel < 1e-5) return false;
    labelRaycaster.set(camera.position, direction.normalize());
    labelRaycaster.near = 0.02;
    labelRaycaster.far = distanceToLabel + 0.03;
    const firstLabeledSurface = labelRaycaster
      .intersectObjects(worldGroup.children, true)
      .find((hit) => hit.object.userData.labelKey);
    return Boolean(
      firstLabeledSurface
      && firstLabeledSurface.object.userData.labelKey !== entry.labelKey
    );
  };

  const boxOccluded = (entry, x, y) => {
    const target = entry.labelKey === "__up__"
      ? upSigilEntry
      : fishbowls.get(entry.labelKey);
    if (!target) return false;
    const targetDepth = camera.position.distanceTo(target.group.position) - target.radius;
    const halfWidth = Math.max(10, entry.width * 0.5);
    const halfHeight = Math.max(6, entry.height * 0.5);
    return occludingSpheres.some((sphere) => {
      if (sphere.labelKey === entry.labelKey || sphere.depth >= targetDepth - 0.02) {
        return false;
      }
      const nearestX = Math.max(x - halfWidth, Math.min(sphere.x, x + halfWidth));
      const nearestY = Math.max(y - halfHeight, Math.min(sphere.y, y + halfHeight));
      return Math.hypot(sphere.x - nearestX, sphere.y - nearestY) < sphere.radius * 0.94;
    });
  };

  labelEntries.forEach((entry) => {
    entry.element.hidden = true;
    const projected = entry.position.clone().project(camera);
    const frameLimit = entry.relation === "child"
      ? (compact ? 0.96 : 0.98)
      : entry.relation === "exit"
        ? 0.98
        : (compact ? 0.82 : 0.92);
    const visible = projected.z > -1 && projected.z < 1
      && Math.abs(projected.x) < frameLimit
      && Math.abs(projected.y) < frameLimit;
    if (!visible) return;
    if (occluded(entry)) return;
    const x = (projected.x * 0.5 + 0.5) * width;
    const y = (-projected.y * 0.5 + 0.5) * height;
    if (boxOccluded(entry, x, y)) return;
    candidates.push({
      entry,
      x,
      y,
      depth: projected.z,
      score: projected.x * projected.x + projected.y * projected.y
    });
  });

  const occupied = [];
  const show = (candidate) => {
    candidate.entry.element.hidden = false;
    candidate.entry.element.style.left = candidate.x + "px";
    candidate.entry.element.style.top = candidate.y + "px";
    candidate.entry.element.style.zIndex = String(Math.round((1 - candidate.depth) * 1000));
    occupied.push(candidate);
  };
  const separated = (candidate) => occupied.every((shown) =>
    Math.hypot(candidate.x - shown.x, candidate.y - shown.y) > (compact ? 82 : 72)
  );
  const showRelation = (relation, limit) => {
    const ordered = candidates
      .filter((candidate) => candidate.entry.relation === relation)
      .sort((first, second) => first.score - second.score);
    let shown = 0;
    ordered.forEach((candidate) => {
      if (shown >= limit || !separated(candidate)) return;
      show(candidate);
      shown += 1;
    });
  };

  candidates
    .filter((candidate) => candidate.entry.relation === "exit")
    .sort((first, second) => first.score - second.score)
    .slice(0, 1)
    .forEach(show);
  candidates
    .filter((candidate) => candidate.entry.relation === "child")
    .sort((first, second) => first.score - second.score)
    .forEach(show);
  showRelation("neighbor", Number.POSITIVE_INFINITY);
}

function desiredCameraPosition() {
  const horizontal = Math.sin(pitch) * distance;
  return new THREE.Vector3(
    Math.sin(yaw) * horizontal,
    Math.cos(pitch) * distance + targetY,
    Math.cos(yaw) * horizontal
  );
}

function applyOrbitCamera() {
  camera.position.copy(desiredCameraPosition());
  camera.lookAt(0, targetY, 0);
}

function resetOrbit() {
  yaw = 0.62;
  if (worldStack.length) {
    targetY = 0.42;
    pitch = 1.72;
    distance = 2.76;
  } else {
    targetY = 0;
    pitch = currentNode.children.length > 8 ? 1.04 : 1;
    distance = currentNode.children.length > 9 ? 5.25 : 5.0;
  }
}

function startCameraTransition(points, lookFrom, lookTo, duration, onComplete) {
  if (reducedMotion.matches) {
    camera.position.copy(points[points.length - 1]);
    camera.lookAt(lookTo);
    onComplete();
    return;
  }
  cameraTransition = {
    curve: new THREE.CatmullRomCurve3(points, false, "centripetal", 0.4),
    lookFrom: lookFrom.clone(),
    lookTo: lookTo.clone(),
    startedAt: performance.now(),
    duration,
    onComplete
  };
  interactionLocked = true;
}

function updateCamera(timeMs) {
  if (!cameraTransition) {
    applyOrbitCamera();
    return;
  }
  const raw = Math.min(1, (timeMs - cameraTransition.startedAt) / cameraTransition.duration);
  const eased = 1 - Math.pow(1 - raw, 3);
  camera.position.copy(cameraTransition.curve.getPoint(eased));
  const look = cameraTransition.lookFrom.clone().lerp(cameraTransition.lookTo, eased);
  camera.lookAt(look);
  if (raw >= 1) {
    transitionCompletion = cameraTransition.onComplete;
    cameraTransition = null;
  }
}

function nodeDefinition(node) {
  return node.definition || node.core || "";
}

function nodeFamily(node) {
  return node.family || node.region || "";
}

function nodeDistinction(node) {
  return node.distinction || node.contrast || "";
}

function navigationPath() {
  return worldStack.map((node) => node.label).concat(currentNode.label).join(" › ");
}

function addDetailRow(grid, name, value) {
  if (!value) return;
  const dt = document.createElement("dt");
  dt.textContent = name;
  const dd = document.createElement("dd");
  dd.textContent = value;
  grid.append(dt, dd);
}

function updateDetail() {
  detailElement.replaceChildren();

  const parent = worldStack.length ? worldStack[worldStack.length - 1] : null;
  const neighborCount = parent
    ? parent.children.filter((child) => child.id !== currentNode.id).length
    : 0;

  const header = document.createElement("div");
  header.className = "viz-row";
  const heading = document.createElement("h3");
  heading.textContent = currentNode.label;
  const badge = document.createElement("span");
  badge.className = "ms3-count";
  badge.textContent = parent
    ? currentNode.children.length + " children · " + neighborCount + " neighbors"
    : currentNode.children.length + (currentNode.children.length === 1 ? " child" : " children");
  header.append(heading, badge);

  const definition = document.createElement("p");
  definition.textContent = nodeDefinition(currentNode);

  const grid = document.createElement("dl");
  grid.className = "ms3-detail-grid";
  addDetailRow(grid, "Path", navigationPath());
  addDetailRow(grid, "Scope", nodeFamily(currentNode));
  addDetailRow(grid, "Role", currentNode.role || "");
  addDetailRow(grid, "Defining contrast", nodeDistinction(currentNode));

  detailElement.append(header, definition, grid);

  if (currentNode.domains && currentNode.domains.length) {
    const readings = document.createElement("section");
    readings.className = "ms3-domain-readings";
    const title = document.createElement("h4");
    title.textContent = "Domain readings";
    const readingsGrid = document.createElement("dl");
    readingsGrid.className = "ms3-detail-grid";
    currentNode.domains.forEach((entry) => addDetailRow(readingsGrid, entry[0], entry[1]));
    readings.append(title, readingsGrid);
    detailElement.append(readings);
  }
}

function renderCurrent(options = {}) {
  clearWorld();
  updatePalette();
  const parentNode = worldStack.length ? worldStack[worldStack.length - 1] : null;
  const neighbors = parentNode
    ? parentNode.children.filter((node) => node.id !== currentNode.id)
    : [];

  currentWorldRadius = parentNode ? 3.25 : (currentNode.children.length > 9 ? 6.25 : 5.8);
  parentWorldRadius = parentNode ? (neighbors.length > 8 ? 7.75 : 7.15) : 0;
  resetOrbit();

  const neighborPositions = neighborLayout(parentNode, neighbors);
  const portalDirections = arrangedPortalDirections(neighborPositions);
  neighborPositions.forEach((item, index) => {
    const neighbor = item.child;
    const color = semanticColor(parentNode, neighbor, index);
    const direction = portalDirections[index];
    const semanticDistance = item.normalizedDistance === undefined
      ? 0.5
      : item.normalizedDistance;
    const portalRadius = 0.46 - semanticDistance * 0.12;
    const tunnelLength = 0.44 + semanticDistance * 0.42;
    const entry = makeNeighborPortal(neighbor, direction, color, {
      radius: portalRadius,
      length: tunnelLength
    });
    entry.relation = "neighbor";
    worldGroup.add(entry.group);
    positions.set(neighbor.id, entry.group.position.clone());
    fishbowls.set(neighbor.id, entry);
    makeNodeLabel(
      neighbor,
      entry.group.position.clone().add(new THREE.Vector3(0, portalRadius * 0.72, 0)),
      "neighbor"
    );
  });

  const currentBoundary = makeFishbowl(
    currentNode,
    currentWorldRadius,
    wallColor,
    {
      opaque: true,
      latticeOpacity: parentNode ? 0.16 : 0.13,
      renderOrder: 1
    }
  );
  worldGroup.add(currentBoundary.group);

  const layout = childLayout(currentNode.children);
  const peerRadius = parentNode
    ? Math.max(0.3, 0.43 - Math.max(0, currentNode.children.length - 5) * 0.011)
    : Math.max(0.48, 0.64 - Math.max(0, currentNode.children.length - 6) * 0.018);
  layout.forEach((item, index) => {
    const child = item.child;
    const radius = peerRadius;
    const color = semanticColor(currentNode, child, index);
    const entry = makeExteriorSigil(child, radius, color, {
      renderOrder: 2
    });
    entry.relation = "child";
    entry.group.position.set(item.x, item.y, item.z);
    worldGroup.add(entry.group);
    positions.set(child.id, entry.group.position.clone());
    fishbowls.set(child.id, entry);
    makeNodeLabel(
      child,
      entry.group.position.clone().add(new THREE.Vector3(0, radius * 0.48, 0)),
      "child"
    );
  });

  attentionMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 22, 14),
    new THREE.MeshBasicMaterial({
      color: attentionColor,
      transparent: true,
      opacity: 1,
      depthWrite: false
    })
  );
  attentionMesh.renderOrder = 3;
  attentionMesh.position.set(0, 0.12, 0);
  attentionTarget = attentionMesh.position.clone();
  worldGroup.add(attentionMesh);

  if (parentNode) {
    const upRadius = 0.44;
    const openingHeight = currentWorldRadius * Math.cos(FISHBOWL_CUT_ANGLE);
    upSigilPosition = new THREE.Vector3(0, openingHeight + upRadius * 0.72, 0);
    upSigilEntry = makeExteriorSigil(
      parentNode,
      upRadius,
      new THREE.Color(0xffffff),
      { exit: true, renderOrder: 3 }
    );
    upSigilEntry.group.position.copy(upSigilPosition);
    worldGroup.add(upSigilEntry.group);
    makeExitLabel(parentNode, upSigilPosition);
  }

  updateDetail();

  const destination = desiredCameraPosition();
  const lookTarget = new THREE.Vector3(0, targetY, 0);

  if (options.arrivalFromCenter && !reducedMotion.matches) {
    const start = new THREE.Vector3(0, 0.18, 0.12);
    camera.position.copy(start);
    startCameraTransition(
      [start, new THREE.Vector3(0, currentWorldRadius * 0.48, 0.62), destination],
      new THREE.Vector3(0, -0.15, 0),
      lookTarget,
      680,
      () => { interactionLocked = false; }
    );
    return;
  }

  if (options.exitFromNode && !reducedMotion.matches) {
    const previousEntry = fishbowls.get(options.exitFromNode.id);
    if (previousEntry) {
      const start = previousEntry.group.position.clone();
      const outward = destination.clone().sub(start).normalize();
      const surface = start.clone().add(outward.multiplyScalar(previousEntry.radius * 1.25));
      camera.position.copy(start);
      startCameraTransition(
        [start, surface, destination],
        previousEntry.group.position,
        lookTarget,
        720,
        () => { interactionLocked = false; }
      );
      return;
    }
  }

  camera.position.copy(destination);
  camera.lookAt(lookTarget);
  interactionLocked = false;
}

function enterNode(node) {
  if (interactionLocked) return;
  const entry = fishbowls.get(node.id);
  if (!entry || entry.relation !== "child") return;

  const finish = () => {
    worldStack.push(currentNode);
    currentNode = node;
    renderCurrent({ arrivalFromCenter: true });
  };

  if (reducedMotion.matches) {
    finish();
    return;
  }

  const center = entry.group.position.clone();
  const outward = camera.position.clone().sub(center).normalize();
  const approach = center.clone().add(outward.clone().multiplyScalar(entry.radius * 1.3));
  const inside = center.clone().add(outward.multiplyScalar(entry.radius * 0.06));
  attentionTarget = inside.clone();

  startCameraTransition(
    [camera.position.clone(), approach, inside],
    new THREE.Vector3(0, targetY, 0),
    center,
    860,
    finish
  );
}

function moveToNeighbor(node) {
  if (interactionLocked || !worldStack.length) return;
  const entry = fishbowls.get(node.id);
  if (!entry || entry.relation !== "neighbor") return;

  const finish = () => {
    currentNode = node;
    renderCurrent({ arrivalFromCenter: true });
  };

  if (reducedMotion.matches) {
    finish();
    return;
  }

  const mouth = entry.group.position.clone();
  const direction = entry.direction.clone();
  const approach = mouth.clone().add(direction.clone().multiplyScalar(-entry.radius * 1.2));
  const tunnelCenter = mouth.clone().add(direction.clone().multiplyScalar(entry.length * 0.48));
  const through = mouth.clone().add(direction.clone().multiplyScalar(entry.length + 0.18));
  attentionTarget = approach.clone();

  startCameraTransition(
    [camera.position.clone(), approach, tunnelCenter, through],
    new THREE.Vector3(0, targetY, 0),
    through,
    1080,
    finish
  );
}

function exitCurrent() {
  if (interactionLocked || !worldStack.length || !upSigilEntry || !upSigilPosition) return;

  const previous = currentNode;
  const finish = () => {
    currentNode = worldStack.pop();
    renderCurrent({ exitFromNode: previous });
  };

  if (reducedMotion.matches) {
    finish();
    return;
  }

  const approach = upSigilPosition.clone().add(
    new THREE.Vector3(0, -upSigilEntry.radius * 1.3, 0)
  );
  const inside = upSigilPosition.clone();
  attentionTarget = approach.clone();

  startCameraTransition(
    [camera.position.clone(), approach, inside],
    new THREE.Vector3(0, targetY, 0),
    upSigilPosition,
    820,
    finish
  );
}

function resize() {
  const width = Math.max(1, sceneElement.clientWidth);
  const height = Math.max(1, sceneElement.clientHeight);
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.fov = width <= 520 ? 78 : 64;
  camera.updateProjectionMatrix();
}

function pointerCoordinates(event) {
  const bounds = canvas.getBoundingClientRect();
  return {
    x: ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
    y: -((event.clientY - bounds.top) / bounds.height) * 2 + 1
  };
}

function interactFromPointer(event) {
  const pointer = pointerCoordinates(event);
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(worldGroup.children, true);

  const childHit = hits.find((candidate) => candidate.object.userData.nodeId);
  if (childHit) {
    const node = nodeIndex.get(childHit.object.userData.nodeId);
    const entry = node ? fishbowls.get(node.id) : null;
    if (entry && entry.relation === "neighbor") moveToNeighbor(node);
    else if (node) enterNode(node);
    return;
  }

  const exitHit = hits.find((candidate) => candidate.object.userData.exitCurrent);
  if (exitHit) exitCurrent();
}

function animate(timeMs) {
  requestAnimationFrame(animate);

  if (attentionMesh && attentionTarget) {
    const factor = reducedMotion.matches ? 1 : 0.12;
    attentionMesh.position.lerp(attentionTarget, factor);
    const pulse = reducedMotion.matches ? 1 : 1 + Math.sin(timeMs / 1000 * 4.2) * 0.1;
    attentionMesh.scale.setScalar(pulse);
  }

  updateCamera(timeMs);
  updateLabels();
  renderer.render(scene, camera);

  if (transitionCompletion) {
    const completion = transitionCompletion;
    transitionCompletion = null;
    requestAnimationFrame(completion);
  }
}

async function initialize() {
  try {
    const results = await Promise.all([
      import("https://esm.sh/three@0.167.1"),
      fetch(new URL("taxonomies.json", import.meta.url)),
      fetch(new URL("semantic-layout.json", import.meta.url))
    ]);
    THREE = results[0];
    const taxonomyResponse = results[1];
    const semanticResponse = results[2];
    if (!taxonomyResponse.ok || !semanticResponse.ok) {
      throw new Error("Taxonomy data did not load");
    }
    taxonomies = await taxonomyResponse.json();
    semanticLayouts = await semanticResponse.json();

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(64, 1, 0.08, 100);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x64748b, 1.1));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.35);
    keyLight.position.set(-4, 7, 5);
    scene.add(keyLight);
    worldGroup = new THREE.Group();
    scene.add(worldGroup);

    canvas.addEventListener("pointerdown", (event) => {
      if (interactionLocked) return;
      dragging = true;
      moved = false;
      pointerStart = { x: event.clientX, y: event.clientY };
      lastPointer = { ...pointerStart };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragging || interactionLocked) return;
      const dx = event.clientX - lastPointer.x;
      const dy = event.clientY - lastPointer.y;
      if (Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 5) {
        moved = true;
      }
      yaw -= dx * 0.008;
      pitch = Math.max(0.35, Math.min(2.5, pitch - dy * 0.006));
      lastPointer = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!dragging) return;
      dragging = false;
      canvas.releasePointerCapture(event.pointerId);
      if (!moved && !interactionLocked) interactFromPointer(event);
    });

    canvas.addEventListener("wheel", (event) => {
      if (interactionLocked) return;
      event.preventDefault();
      distance = Math.max(
        2.6,
        Math.min(currentWorldRadius - 0.42, distance + event.deltaY * 0.008)
      );
    }, { passive: false });

    mapSelect.addEventListener("change", () => activateTaxonomy(mapSelect.value));

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(sceneElement);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderCurrent());

    updatePalette();
    activateTaxonomy(currentTaxonomyKey);
    resize();
    requestAnimationFrame(animate);
  } catch (error) {
    sceneElement.setAttribute("role", "alert");
    sceneElement.textContent = "The taxonomy renderer could not start in this surface.";
    mapSelect.disabled = true;
  }
}

initialize();
</script>
</body>
</html>

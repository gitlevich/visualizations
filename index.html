<title>Mind Sigil</title>
<style>
  :root {
    --background: #f5f7fb;
    --foreground: #162033;
    --card: rgba(255, 255, 255, 0.82);
    --muted-foreground: #607089;
    --border: rgba(22, 32, 51, 0.16);
    --yellow: #f4b740;
    --viz-series-1: #3366ff;
    --viz-series-2: #8b5cf6;
    --viz-series-3: #00a6a6;
    --viz-series-4: #e85d75;
    --viz-series-5: #d98d20;
    --viz-series-6: #5c7c3b;
    --font-size-base: 16px;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color-scheme: light dark;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% 5%, rgba(51, 102, 255, 0.12), transparent 34rem),
      var(--background);
    color: var(--foreground);
  }

  h2, h3 { letter-spacing: -0.025em; }
  h2 { margin: 0; font-size: clamp(1.45rem, 4vw, 2.15rem); }
  p { line-height: 1.45; }

  #mind-sigil-3d {
    width: min(100%, 1180px);
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) max(0.85rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(0.85rem, env(safe-area-inset-left));
  }

  .viz-controls, .viz-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.45rem;
  }

  .viz-row { justify-content: space-between; }

  .viz-badge {
    display: inline-flex;
    align-items: center;
    min-height: 1.75rem;
    padding: 0.28rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted-foreground);
    font-size: 0.78rem;
    line-height: 1.1;
  }

  .form-select {
    min-height: 2.5rem;
    border: 1px solid var(--border);
    border-radius: 0.72rem;
    background: var(--card);
    color: var(--foreground);
    padding: 0.55rem 0.78rem;
    font: inherit;
  }

  .form-label {
    display: inline-flex;
    align-items: center;
    gap: 0.42rem;
    color: var(--muted-foreground);
    font-size: 0.88rem;
  }


  .card {
    border: 1px solid var(--border);
    border-radius: 1rem;
    background: var(--card);
    padding: 0.85rem;
    backdrop-filter: blur(18px);
  }

  .text-small { font-size: 0.78rem; }

  #mind-sigil-3d .ms3-scene {
    border: 1px solid var(--border);
    border-radius: 1rem;
    background: rgba(255, 255, 255, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background: #090d16;
      --foreground: #edf2ff;
      --card: rgba(18, 25, 40, 0.82);
      --muted-foreground: #9aa8c0;
      --border: rgba(237, 242, 255, 0.16);
      --yellow: #ffd166;
      --viz-series-1: #6d8cff;
      --viz-series-2: #ad84ff;
      --viz-series-3: #42d4cf;
      --viz-series-4: #ff8296;
      --viz-series-5: #f6b957;
      --viz-series-6: #9bc66f;
    }

    body {
      background:
        radial-gradient(circle at 50% 5%, rgba(109, 140, 255, 0.14), transparent 34rem),
        var(--background);
    }

    #mind-sigil-3d .ms3-scene { background: rgba(255, 255, 255, 0.025); }
  }

  @media (max-width: 520px) {
    .form-label { width: 100%; justify-content: space-between; }
    .form-select { flex: 1; min-width: 0; }
  }
</style>

<body>
<style>

<section id="mind-sigil-3d" aria-labelledby="ms3-title">
  <header class="ms3-header">
    <h2 id="ms3-title">Philosophical taxonomies as recursive sigils</h2>
    <p>The current sigil contains its children; sibling sigils remain visible through it in their shared parent.</p>
  </header>

  <label class="form-label ms3-map-control" for="ms3-map">Taxonomy
    <select id="ms3-map" class="form-select">
      <option value="subjectWorld" selected>Subject–world articulation</option>
      <option value="mind">Mind: non-synonymous capacities</option>
    </select>
  </label>

  <div id="ms3-scene" class="ms3-scene">
    <canvas id="ms3-canvas" aria-label="Interactive three-dimensional recursive sigil structure"></canvas>
    <div id="ms3-labels" class="ms3-label-layer"></div>
    <span class="ms3-help text-small">Tap an inner sigil to enter · tap the enclosing opening to return · drag to look around</span>
  </div>

  <div id="ms3-detail" class="card ms3-detail" aria-live="polite"></div>
</section>

<script type="module">
const rootElement = document.getElementById("mind-sigil-3d");
const sceneElement = document.getElementById("ms3-scene");
const canvas = document.getElementById("ms3-canvas");
const labelLayer = document.getElementById("ms3-labels");
const detailElement = document.getElementById("ms3-detail");
const mapSelect = document.getElementById("ms3-map");

const shortLabels = {
  "subject-world": "Subject–world",
  "structural-vocabulary": "Structure",
  "levels": "Description levels",
  "experience-domain": "Experience",
  "selection-domain": "Attention",
  "content-domain": "Mental content",
  "cognition-domain": "Cognition",
  "memory-domain": "Memory",
  "affect-domain": "Affect",
  "agency-domain": "Agency",
  "self-domain": "Self",
  "social-domain": "Social mind"
};

const FISHBOWL_CUT_ANGLE = Math.PI * 0.2;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");

let THREE;
let renderer;
let scene;
let camera;
let taxonomies;
let taxonomy;
let currentNode;
let currentTaxonomyKey = "subjectWorld";
let worldStack = [];
let nodeIndex = new Map();
let parentIndex = new Map();
let pathIndex = new Map();

let worldGroup;
let positions = new Map();
let fishbowls = new Map();
let labelEntries = [];
let attentionMesh;
let attentionTarget;
let palette = [];
let neutralColor;
let attentionColor;

let currentWorldRadius = 5.8;
let parentWorldRadius = 0;
let yaw = 0.62;
let pitch = 0.46;
let distance = 4.7;
let targetY = -1.15;
let dragging = false;
let moved = false;
let pointerStart = { x: 0, y: 0 };
let lastPointer = { x: 0, y: 0 };
let interactionLocked = false;
let cameraTransition = null;
let transitionCompletion = null;

function resolveColor(variableName) {
  const probe = document.createElement("span");
  probe.style.color = "var(" + variableName + ")";
  probe.style.position = "absolute";
  probe.style.visibility = "hidden";
  rootElement.append(probe);
  const value = getComputedStyle(probe).color;
  probe.remove();
  return value;
}

function updatePalette() {
  palette = [1, 2, 3, 4, 5, 6].map((index) =>
    new THREE.Color(resolveColor("--viz-series-" + index))
  );
  neutralColor = new THREE.Color(resolveColor("--muted-foreground"));
  attentionColor = new THREE.Color(resolveColor("--yellow"));
}

function indexTree(node, parent = null, path = []) {
  node.children = node.children || [];
  nodeIndex.set(node.id, node);
  parentIndex.set(node.id, parent);
  pathIndex.set(node.id, path.concat(node.label));
  node.children.forEach((child) => indexTree(child, node, path.concat(node.label)));
}

function activateTaxonomy(key) {
  currentTaxonomyKey = key;
  taxonomy = taxonomies[key];
  nodeIndex = new Map();
  parentIndex = new Map();
  pathIndex = new Map();
  indexTree(taxonomy);
  worldStack = [];
  currentNode = taxonomy;
  cameraTransition = null;
  transitionCompletion = null;
  interactionLocked = false;
  renderCurrent();
  document.title = taxonomy.label + " — recursive sigils";
}

function countDescendants(node) {
  return node.children.reduce((sum, child) => sum + 1 + countDescendants(child), 0);
}

function disposeObject(object) {
  object.traverse((child) => {
    if (child.geometry) child.geometry.dispose();
    if (child.material) {
      const materials = Array.isArray(child.material) ? child.material : [child.material];
      materials.forEach((material) => material.dispose());
    }
  });
}

function clearWorld() {
  if (worldGroup) {
    scene.remove(worldGroup);
    disposeObject(worldGroup);
  }
  worldGroup = new THREE.Group();
  scene.add(worldGroup);
  positions = new Map();
  fishbowls = new Map();
  labelEntries = [];
  labelLayer.replaceChildren();
}

function fishbowlGeometry(radius, segments = 30) {
  return new THREE.SphereGeometry(
    radius,
    segments,
    Math.max(14, segments),
    0,
    Math.PI * 2,
    FISHBOWL_CUT_ANGLE,
    Math.PI - FISHBOWL_CUT_ANGLE
  );
}

function makeFishbowl(node, radius, color, options = {}) {
  const group = new THREE.Group();
  const opacity = options.opacity === undefined ? 0.18 : options.opacity;
  const shell = new THREE.Mesh(
    fishbowlGeometry(radius),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity,
      depthWrite: false,
      side: THREE.DoubleSide
    })
  );
  const openingRadius = radius * Math.sin(FISHBOWL_CUT_ANGLE);
  const openingHeight = radius * Math.cos(FISHBOWL_CUT_ANGLE);
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(openingRadius, Math.max(0.018, radius * 0.025), 8, 72),
    new THREE.MeshBasicMaterial({
      color,
      transparent: true,
      opacity: Math.min(0.9, opacity * 3.8),
      depthWrite: false
    })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = openingHeight;

  if (options.child) {
    shell.userData.nodeId = node.id;
    rim.userData.nodeId = node.id;
  }
  if (options.exit) {
    rim.userData.exitCurrent = true;
    const portal = new THREE.Mesh(
      new THREE.CircleGeometry(openingRadius * 0.94, 72),
      new THREE.MeshBasicMaterial({
        color: attentionColor,
        transparent: true,
        opacity: 0.035,
        depthWrite: false,
        side: THREE.DoubleSide
      })
    );
    portal.rotation.x = -Math.PI / 2;
    portal.position.y = openingHeight + 0.012;
    portal.userData.exitCurrent = true;
    group.add(portal);
  }

  group.add(shell, rim);
  return { group, shell, rim, radius, openingHeight, openingRadius };
}

function radialLayout(children, innerRadius, outerRadius) {
  const count = children.length;
  if (!count) return [];
  if (count === 1) return [{ child: children[0], x: 0, z: 0 }];
  if (count <= 6) {
    const ringRadius = count <= 3 ? innerRadius * 0.82 : innerRadius;
    return children.map((child, index) => {
      const angle = -Math.PI / 2 + index * Math.PI * 2 / count;
      return { child, x: Math.cos(angle) * ringRadius, z: Math.sin(angle) * ringRadius };
    });
  }

  const innerCount = Math.ceil(count * 0.42);
  const outerCount = count - innerCount;
  const layout = [];
  children.slice(0, innerCount).forEach((child, index) => {
    const angle = -Math.PI / 2 + index * Math.PI * 2 / innerCount;
    layout.push({ child, x: Math.cos(angle) * innerRadius, z: Math.sin(angle) * innerRadius });
  });
  children.slice(innerCount).forEach((child, index) => {
    const angle = -Math.PI / 2 + Math.PI / Math.max(outerCount, 1) + index * Math.PI * 2 / outerCount;
    layout.push({ child, x: Math.cos(angle) * outerRadius, z: Math.sin(angle) * outerRadius });
  });
  return layout;
}

function childLayout(children) {
  const scale = currentWorldRadius / 5.8;
  return radialLayout(children, 2.05 * scale, 3.72 * scale);
}

function neighborLayout(neighbors) {
  return radialLayout(neighbors, 4.55, 6.08);
}

function addRecursiveHints(parentGroup, node, radius, color) {
  const hints = node.children.slice(0, 5);
  if (!hints.length) return;
  const hintRadius = radius * 0.13;
  hints.forEach((child, index) => {
    const angle = -Math.PI / 2 + index * Math.PI * 2 / hints.length;
    const mini = makeFishbowl(child, hintRadius, color, { opacity: 0.24 });
    mini.group.position.set(
      Math.cos(angle) * radius * 0.38,
      -radius * 0.34,
      Math.sin(angle) * radius * 0.38
    );
    parentGroup.add(mini.group);
  });
}

function makeNodeLabel(node, position, relation) {
  const element = document.createElement("button");
  element.type = "button";
  element.className = "ms3-label text-small";
  element.dataset.kind = "node";
  element.textContent = shortLabels[node.id] || node.label.replace(/^\d+\.\s*/, "");
  element.setAttribute(
    "aria-label",
    (relation === "neighbor" ? "Move to neighboring sigil " : "Enter ") + node.label
  );
  element.addEventListener("click", () => {
    if (relation === "neighbor") moveToNeighbor(node);
    else enterNode(node);
  });
  labelLayer.append(element);
  labelEntries.push({ position, element, relation });
}

function makeExitLabel(parentNode) {
  const element = document.createElement("button");
  element.type = "button";
  element.className = "ms3-label text-small";
  element.dataset.kind = "exit";
  element.textContent = "↑ " + parentNode.label;
  element.setAttribute("aria-label", "Return to " + parentNode.label);
  element.addEventListener("click", exitCurrent);
  labelLayer.append(element);
  labelEntries.push({
    position: new THREE.Vector3(),
    element,
    relation: "exit",
    openingRadius: currentWorldRadius * Math.sin(FISHBOWL_CUT_ANGLE),
    openingHeight: currentWorldRadius * Math.cos(FISHBOWL_CUT_ANGLE) + 0.14
  });
}

function updateLabels() {
  const width = sceneElement.clientWidth;
  const height = sceneElement.clientHeight;
  labelEntries.forEach((entry) => {
    if (entry.relation === "exit") {
      entry.position.set(
        -Math.sin(yaw) * entry.openingRadius * 0.82,
        entry.openingHeight,
        -Math.cos(yaw) * entry.openingRadius * 0.82
      );
    }
    const projected = entry.position.clone().project(camera);
    const visible = projected.z > -1 && projected.z < 1;
    entry.element.hidden = !visible;
    if (!visible) return;
    const x = (projected.x * 0.5 + 0.5) * width;
    const y = (-projected.y * 0.5 + 0.5) * height;
    entry.element.style.left = Math.max(18, Math.min(width - 18, x)) + "px";
    entry.element.style.top = Math.max(18, Math.min(height - 18, y)) + "px";
  });
}

function desiredCameraPosition() {
  const horizontal = Math.sin(pitch) * distance;
  return new THREE.Vector3(
    Math.sin(yaw) * horizontal,
    Math.cos(pitch) * distance + targetY,
    Math.cos(yaw) * horizontal
  );
}

function applyOrbitCamera() {
  camera.position.copy(desiredCameraPosition());
  camera.lookAt(0, targetY, 0);
}

function resetOrbit() {
  yaw = 0.62;
  if (worldStack.length) {
    targetY = -0.72;
    pitch = 1.02;
    distance = 2.68;
  } else {
    targetY = -1.15;
    pitch = currentNode.children.length > 8 ? 0.82 : 0.9;
    distance = currentNode.children.length > 9 ? 5.0 : 4.65;
  }
}

function startCameraTransition(points, lookFrom, lookTo, duration, onComplete) {
  if (reducedMotion.matches) {
    camera.position.copy(points[points.length - 1]);
    camera.lookAt(lookTo);
    onComplete();
    return;
  }
  cameraTransition = {
    curve: new THREE.CatmullRomCurve3(points, false, "centripetal", 0.4),
    lookFrom: lookFrom.clone(),
    lookTo: lookTo.clone(),
    startedAt: performance.now(),
    duration,
    onComplete
  };
  interactionLocked = true;
}

function updateCamera(timeMs) {
  if (!cameraTransition) {
    applyOrbitCamera();
    return;
  }
  const raw = Math.min(1, (timeMs - cameraTransition.startedAt) / cameraTransition.duration);
  const eased = 1 - Math.pow(1 - raw, 3);
  camera.position.copy(cameraTransition.curve.getPoint(eased));
  const look = cameraTransition.lookFrom.clone().lerp(cameraTransition.lookTo, eased);
  camera.lookAt(look);
  if (raw >= 1) {
    transitionCompletion = cameraTransition.onComplete;
    cameraTransition = null;
  }
}

function nodeDefinition(node) {
  return node.definition || node.core || "";
}

function nodeFamily(node) {
  return node.family || node.region || "";
}

function nodeDistinction(node) {
  return node.distinction || node.contrast || "";
}

function navigationPath() {
  return worldStack.map((node) => node.label).concat(currentNode.label).join(" › ");
}

function addDetailRow(grid, name, value) {
  if (!value) return;
  const dt = document.createElement("dt");
  dt.textContent = name;
  const dd = document.createElement("dd");
  dd.textContent = value;
  grid.append(dt, dd);
}

function updateDetail() {
  detailElement.replaceChildren();

  const parent = worldStack.length ? worldStack[worldStack.length - 1] : null;
  const neighborCount = parent
    ? parent.children.filter((child) => child.id !== currentNode.id).length
    : 0;

  const header = document.createElement("div");
  header.className = "viz-row";
  const heading = document.createElement("h3");
  heading.textContent = currentNode.label;
  const badge = document.createElement("span");
  badge.className = "viz-badge";
  badge.textContent = parent
    ? currentNode.children.length + " inside · " + neighborCount + " outside"
    : currentNode.children.length + (currentNode.children.length === 1 ? " child" : " children");
  header.append(heading, badge);

  const definition = document.createElement("p");
  definition.textContent = nodeDefinition(currentNode);

  const grid = document.createElement("dl");
  grid.className = "ms3-detail-grid";
  addDetailRow(grid, "Path", navigationPath());
  addDetailRow(grid, "Scope", nodeFamily(currentNode));
  addDetailRow(grid, "Role", currentNode.role || "");
  addDetailRow(grid, "Defining contrast", nodeDistinction(currentNode));

  detailElement.append(header, definition, grid);

  if (currentNode.domains && currentNode.domains.length) {
    const readings = document.createElement("section");
    readings.className = "ms3-domain-readings";
    const title = document.createElement("h4");
    title.textContent = "Domain readings";
    const readingsGrid = document.createElement("dl");
    readingsGrid.className = "ms3-detail-grid";
    currentNode.domains.forEach((entry) => addDetailRow(readingsGrid, entry[0], entry[1]));
    readings.append(title, readingsGrid);
    detailElement.append(readings);
  }
}

function renderCurrent(options = {}) {
  clearWorld();
  updatePalette();
  const parentNode = worldStack.length ? worldStack[worldStack.length - 1] : null;
  const neighbors = parentNode
    ? parentNode.children.filter((node) => node.id !== currentNode.id)
    : [];

  currentWorldRadius = parentNode ? 3.25 : (currentNode.children.length > 9 ? 6.25 : 5.8);
  parentWorldRadius = parentNode ? (neighbors.length > 8 ? 7.75 : 7.15) : 0;

  if (parentNode) {
    const parentBoundary = makeFishbowl(
      parentNode,
      parentWorldRadius,
      neutralColor,
      { opacity: 0.024 }
    );
    worldGroup.add(parentBoundary.group);
  }

  const neighborPositions = neighborLayout(neighbors);
  neighborPositions.forEach((item, index) => {
    const neighbor = item.child;
    const descendants = countDescendants(neighbor);
    const radius = 0.46 + Math.min(0.2, Math.log2(descendants + 1) * 0.05);
    const siblingIndex = parentNode.children.findIndex((node) => node.id === neighbor.id);
    const color = palette[(siblingIndex < 0 ? index : siblingIndex) % palette.length];
    const entry = makeFishbowl(neighbor, radius, color, { child: true, opacity: 0.16 });
    entry.relation = "neighbor";
    entry.group.position.set(item.x, -1.0, item.z);
    worldGroup.add(entry.group);
    positions.set(neighbor.id, entry.group.position.clone());
    fishbowls.set(neighbor.id, entry);
    makeNodeLabel(
      neighbor,
      entry.group.position.clone().add(new THREE.Vector3(0, radius * 0.48, 0)),
      "neighbor"
    );
  });

  const currentBoundary = makeFishbowl(
    currentNode,
    currentWorldRadius,
    neutralColor,
    { opacity: parentNode ? 0.09 : 0.065, exit: Boolean(parentNode) }
  );
  worldGroup.add(currentBoundary.group);

  const layout = childLayout(currentNode.children);
  layout.forEach((item, index) => {
    const child = item.child;
    const descendants = countDescendants(child);
    const radius = parentNode
      ? 0.36 + Math.min(0.18, Math.log2(descendants + 1) * 0.045)
      : 0.56 + Math.min(0.34, Math.log2(descendants + 1) * 0.082);
    const color = palette[index % palette.length];
    const entry = makeFishbowl(child, radius, color, { child: true, opacity: 0.19 });
    entry.relation = "child";
    entry.group.position.set(item.x, parentNode ? -0.78 : -1.32, item.z);
    addRecursiveHints(entry.group, child, radius, color);
    worldGroup.add(entry.group);
    positions.set(child.id, entry.group.position.clone());
    fishbowls.set(child.id, entry);
    makeNodeLabel(
      child,
      entry.group.position.clone().add(new THREE.Vector3(0, radius * 0.48, 0)),
      "child"
    );
  });

  attentionMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.15, 22, 14),
    new THREE.MeshBasicMaterial({ color: attentionColor })
  );
  attentionMesh.position.set(0, 0.12, 0);
  attentionTarget = attentionMesh.position.clone();
  worldGroup.add(attentionMesh);

  if (parentNode) makeExitLabel(parentNode);

  resetOrbit();
  updateDetail();

  const destination = desiredCameraPosition();
  const lookTarget = new THREE.Vector3(0, targetY, 0);

  if (options.arrivalFromCenter && !reducedMotion.matches) {
    const start = new THREE.Vector3(0, 0.18, 0.12);
    camera.position.copy(start);
    startCameraTransition(
      [start, new THREE.Vector3(0, currentWorldRadius * 0.48, 0.62), destination],
      new THREE.Vector3(0, -0.15, 0),
      lookTarget,
      680,
      () => { interactionLocked = false; }
    );
    return;
  }

  if (options.exitFromNode && !reducedMotion.matches) {
    const previousEntry = fishbowls.get(options.exitFromNode.id);
    if (previousEntry) {
      const start = previousEntry.group.position.clone().add(
        new THREE.Vector3(0, previousEntry.openingHeight + previousEntry.radius * 0.6, 0)
      );
      camera.position.copy(start);
      startCameraTransition(
        [start, start.clone().add(new THREE.Vector3(0, 0.9, 0.35)), destination],
        previousEntry.group.position,
        lookTarget,
        720,
        () => { interactionLocked = false; }
      );
      return;
    }
  }

  camera.position.copy(destination);
  camera.lookAt(lookTarget);
  interactionLocked = false;
}

function enterNode(node) {
  if (interactionLocked) return;
  const entry = fishbowls.get(node.id);
  if (!entry || entry.relation !== "child") return;

  const finish = () => {
    worldStack.push(currentNode);
    currentNode = node;
    renderCurrent({ arrivalFromCenter: true });
  };

  if (reducedMotion.matches) {
    finish();
    return;
  }

  const center = entry.group.position.clone();
  const approach = center.clone().add(
    new THREE.Vector3(0, entry.openingHeight + entry.radius * 0.72, entry.radius * 0.18)
  );
  const inside = center.clone().add(new THREE.Vector3(0, 0.06, 0));
  attentionTarget = inside.clone();

  startCameraTransition(
    [camera.position.clone(), approach, inside],
    new THREE.Vector3(0, targetY, 0),
    center,
    860,
    finish
  );
}

function moveToNeighbor(node) {
  if (interactionLocked || !worldStack.length) return;
  const entry = fishbowls.get(node.id);
  if (!entry || entry.relation !== "neighbor") return;

  const finish = () => {
    currentNode = node;
    renderCurrent({ arrivalFromCenter: true });
  };

  if (reducedMotion.matches) {
    finish();
    return;
  }

  const currentOpeningHeight = currentWorldRadius * Math.cos(FISHBOWL_CUT_ANGLE);
  const leaveCurrent = new THREE.Vector3(0, currentOpeningHeight + 0.36, 0);
  const center = entry.group.position.clone();
  const approach = center.clone().add(
    new THREE.Vector3(0, entry.openingHeight + entry.radius * 0.72, entry.radius * 0.16)
  );
  const inside = center.clone().add(new THREE.Vector3(0, 0.05, 0));
  attentionTarget = inside.clone();

  startCameraTransition(
    [camera.position.clone(), leaveCurrent, approach, inside],
    new THREE.Vector3(0, targetY, 0),
    center,
    1080,
    finish
  );
}

function exitCurrent() {
  if (interactionLocked || !worldStack.length) return;

  const previous = currentNode;
  const finish = () => {
    currentNode = worldStack.pop();
    renderCurrent({ exitFromNode: previous });
  };

  if (reducedMotion.matches) {
    finish();
    return;
  }

  const openingHeight = currentWorldRadius * Math.cos(FISHBOWL_CUT_ANGLE);
  const innerOpening = new THREE.Vector3(0, openingHeight - 0.38, 0);
  const outside = new THREE.Vector3(0, currentWorldRadius + 0.78, 0);
  attentionTarget = innerOpening.clone();

  startCameraTransition(
    [camera.position.clone(), innerOpening, outside],
    new THREE.Vector3(0, targetY, 0),
    new THREE.Vector3(0, openingHeight, 0),
    820,
    finish
  );
}

function resize() {
  const width = Math.max(1, sceneElement.clientWidth);
  const height = Math.max(1, sceneElement.clientHeight);
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}

function pointerCoordinates(event) {
  const bounds = canvas.getBoundingClientRect();
  return {
    x: ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
    y: -((event.clientY - bounds.top) / bounds.height) * 2 + 1
  };
}

function interactFromPointer(event) {
  const pointer = pointerCoordinates(event);
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(worldGroup.children, true);

  const childHit = hits.find((candidate) => candidate.object.userData.nodeId);
  if (childHit) {
    const node = nodeIndex.get(childHit.object.userData.nodeId);
    const entry = node ? fishbowls.get(node.id) : null;
    if (entry && entry.relation === "neighbor") moveToNeighbor(node);
    else if (node) enterNode(node);
    return;
  }

  const exitHit = hits.find((candidate) => candidate.object.userData.exitCurrent);
  if (exitHit) exitCurrent();
}

function animate(timeMs) {
  requestAnimationFrame(animate);

  if (attentionMesh && attentionTarget) {
    const factor = reducedMotion.matches ? 1 : 0.12;
    attentionMesh.position.lerp(attentionTarget, factor);
    const pulse = reducedMotion.matches ? 1 : 1 + Math.sin(timeMs / 1000 * 4.2) * 0.1;
    attentionMesh.scale.setScalar(pulse);
  }

  updateCamera(timeMs);
  updateLabels();
  renderer.render(scene, camera);

  if (transitionCompletion) {
    const completion = transitionCompletion;
    transitionCompletion = null;
    requestAnimationFrame(completion);
  }
}

async function initialize() {
  try {
    const results = await Promise.all([
      import("https://esm.sh/three@0.167.1"),
      fetch(new URL("taxonomies.json", import.meta.url))
    ]);
    THREE = results[0];
    const response = results[1];
    if (!response.ok) throw new Error("Taxonomy data did not load");
    taxonomies = await response.json();

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(64, 1, 0.08, 100);
    worldGroup = new THREE.Group();
    scene.add(worldGroup);

    canvas.addEventListener("pointerdown", (event) => {
      if (interactionLocked) return;
      dragging = true;
      moved = false;
      pointerStart = { x: event.clientX, y: event.clientY };
      lastPointer = { ...pointerStart };
      canvas.setPointerCapture(event.pointerId);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!dragging || interactionLocked) return;
      const dx = event.clientX - lastPointer.x;
      const dy = event.clientY - lastPointer.y;
      if (Math.hypot(event.clientX - pointerStart.x, event.clientY - pointerStart.y) > 5) {
        moved = true;
      }
      yaw -= dx * 0.008;
      pitch = Math.max(0.17, Math.min(1.22, pitch + dy * 0.006));
      lastPointer = { x: event.clientX, y: event.clientY };
    });

    canvas.addEventListener("pointerup", (event) => {
      if (!dragging) return;
      dragging = false;
      canvas.releasePointerCapture(event.pointerId);
      if (!moved && !interactionLocked) interactFromPointer(event);
    });

    canvas.addEventListener("wheel", (event) => {
      if (interactionLocked) return;
      event.preventDefault();
      distance = Math.max(
        2.6,
        Math.min(currentWorldRadius - 0.42, distance + event.deltaY * 0.008)
      );
    }, { passive: false });

    mapSelect.addEventListener("change", () => activateTaxonomy(mapSelect.value));

    const resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(sceneElement);
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderCurrent());

    updatePalette();
    activateTaxonomy(currentTaxonomyKey);
    resize();
    requestAnimationFrame(animate);
  } catch (error) {
    sceneElement.setAttribute("role", "alert");
    sceneElement.textContent = "The taxonomy renderer could not start in this surface.";
    mapSelect.disabled = true;
  }
}

initialize();
</script>
</body>
</html>
